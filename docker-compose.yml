version: '3.9'

services:
  stackapidemo:
    image: stackapidemo
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
    ports:
      - "8080:8080"
      - "8081:8081"
    build:
      context: .
      dockerfile: StackApiDemo/Dockerfile
    depends_on:
      sql:
        condition: service_healthy
  sql:
    image: "mcr.microsoft.com/mssql/server:latest"
    container_name: docker-sql-server-express
    ports:
      - "1433:1433" 
    environment:
      - ACCEPT_EULA=y
      - SA_PASSWORD=MyPass@word
      - MSSQL_PID=Express
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-Usa", "-PMyPass@word", "-Q", "select 1"]
      interval: 5s
      retries: 20
  rabbitmq:
    image: rabbitmq:3-management 
    ports:
        - "5672:5672"
        - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 20s
      timeout: 20s
      retries: 3
  rabbitreceiver:
    build:
      context: .
      dockerfile: RabbitReceiver/Dockerfile
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      stackapidemo:
        condition: service_started

  
  